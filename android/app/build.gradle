plugins {
    id 'com.android.application'
}

android {
    namespace 'com.qiyin.music'
    compileSdk 35
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'com.qiyin.music'
        minSdk 23
        targetSdk 35
        versionCode 3
        versionName '1.2'
    }

    sourceSets {
        main.assets.srcDirs = ['../../web']
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
