<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111310">
  <meta name="description" content="栖音 QIYIN — 免费、无广告的本地音乐播放器，导入音乐，听见自己的频率。">
  <title>栖音 QIYIN · 听见自己的频率</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <svg class="svg-defs" aria-hidden="true">
    <symbol id="i-home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/></symbol>
    <symbol id="i-compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5Z"/></symbol>
    <symbol id="i-library" viewBox="0 0 24 24"><path d="M4 4v16M9 4v16M14 5l5-1 3 15-5 1Z"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21l7.7-7.5 1.1-1.1a5.5 5.5 0 0 0 0-7.8Z"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path class="fill" d="m8 5 11 7-11 7Z"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path class="fill" d="M7 5h4v14H7zM14 5h4v14h-4z"/></symbol>
    <symbol id="i-prev" viewBox="0 0 24 24"><path class="fill" d="M6 5h2v14H6zM19 5v14L8 12Z"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path class="fill" d="M16 5h2v14h-2zM5 5v14l11-7Z"/></symbol>
    <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M3 7h3c5 0 7 10 12 10h3M18 14l3 3-3 3M3 17h3c2.5 0 4-2.5 5.5-5M15 7h6M18 4l3 3-3 3"/></symbol>
    <symbol id="i-repeat" viewBox="0 0 24 24"><path d="m17 2 4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 0 1-3 3H3"/></symbol>
    <symbol id="i-volume" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4ZM15 9a4 4 0 0 1 0 6M18 6a8 8 0 0 1 0 12"/></symbol>
    <symbol id="i-muted" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4ZM16 9l5 6M21 9l-5 6"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6h12M9 12h12M9 18h12M3 6h2M3 12h2M3 18h2"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V3M7 8l5-5 5 5M4 14v6h16v-6"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M14 7l5 5-5 5"/></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="m12 2 1.8 6.2L20 10l-6.2 1.8L12 18l-1.8-6.2L4 10l6.2-1.8ZM19 17l.8 2.2L22 20l-2.2.8L19 23l-.8-2.2L16 20l2.2-.8Z"/></symbol>
    <symbol id="i-headphones" viewBox="0 0 24 24"><path d="M4 14v-3a8 8 0 0 1 16 0v3M4 14h4v7H6a2 2 0 0 1-2-2ZM20 14h-4v7h2a2 2 0 0 0 2-2Z"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle class="fill" cx="5" cy="12" r="1.5"/><circle class="fill" cx="12" cy="12" r="1.5"/><circle class="fill" cx="19" cy="12" r="1.5"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-life" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
    <symbol id="i-cloud" viewBox="0 0 24 24"><path d="M17 16a4 4 0 0 0 0-8 6 6 0 0 0-11.5 2A3.5 3.5 0 0 0 6 16"/><path d="M12 11v8M9 16l3 3 3-3"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></symbol>
    <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7 0l2-2a5 5 0 0 0-7-7l-1 1M14 11a5 5 0 0 0-7 0l-2 2a5 5 0 0 0 7 7l1-1"/></symbol>
  </svg>

  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#" data-view="home" aria-label="栖音首页">
        <span class="brand-mark"><i></i><i></i><i></i><i></i></span>
        <span><strong>栖音</strong><small>QIYIN MUSIC</small></span>
      </a>
      <div class="sidebar-scroll">
        <nav class="main-nav" aria-label="主导航">
          <p class="nav-label">音乐空间</p>
          <button class="nav-item active" data-view="home"><svg><use href="#i-home"/></svg><span>首页</span></button>
          <button class="nav-item" data-view="discover"><svg><use href="#i-compass"/></svg><span>发现音乐</span><span class="nav-dot"></span></button>
          <button class="nav-item" data-view="library"><svg><use href="#i-library"/></svg><span>我的曲库</span><span class="count" id="library-count">6</span></button>
          <button class="nav-item" data-view="life"><svg><use href="#i-life"/></svg><span>我的生活</span><span class="count" id="life-count">0</span></button>
          <p class="nav-label second">我的收藏</p>
          <button class="nav-item" data-view="favorites"><svg><use href="#i-heart"/></svg><span>喜欢的音乐</span></button>
          <button class="nav-item" data-view="history"><svg><use href="#i-clock"/></svg><span>最近播放</span></button>
        </nav>
        <div class="sidebar-note">
          <span class="note-icon"><svg><use href="#i-spark"/></svg></span>
          <strong>好音乐，不设限</strong>
          <p>无广告，无订阅。<br>只留下你和音乐。</p>
          <button class="text-link" id="open-about">了解栖音 <svg><use href="#i-arrow"/></svg></button>
        </div>
      </div>
      <button class="import-button" id="import-button"><svg><use href="#i-plus"/></svg><span>导入本地音乐</span></button>
      <input type="file" id="file-input" accept="audio/*,.mp3,.wav,.ogg,.m4a,.flac" multiple hidden>
      <div class="sidebar-foot"><span class="status-dot"></span> 本地优先 · 导入时联网</div>
    </aside>

    <div class="main-frame">
      <header class="topbar">
        <a class="mobile-brand brand" href="#" data-view="home"><span class="brand-mark"><i></i><i></i><i></i><i></i></span><strong>栖音</strong></a>
        <label class="search-box">
          <svg><use href="#i-search"/></svg>
          <input id="search-input" type="search" placeholder="搜索歌曲、音乐人或风格…" autocomplete="off" aria-label="搜索音乐">
          <kbd>⌘ K</kbd>
        </label>
        <div class="topbar-right">
          <span class="free-badge">FREE TO LISTEN</span>
          <button class="icon-button help-button" id="help-button" title="播放快捷键" aria-label="播放快捷键"><span>?</span></button>
          <div class="avatar" title="本地访客">Q</div>
        </div>
      </header>
      <main id="main-content" tabindex="-1"></main>
    </div>

    <aside class="queue-panel" id="queue-panel">
      <div class="queue-head"><div><p class="eyebrow">NOW PLAYING</p><h2>正在播放</h2></div><button class="icon-button" id="close-queue" aria-label="收起播放队列"><svg><use href="#i-more"/></svg></button></div>
      <div class="now-art cover art-0" id="now-art"><span class="cover-kicker">QIYIN ORIGINAL</span><strong id="art-title">TWILIGHT<br>FLIGHT</strong><span class="cover-index">VOL. 001</span><button class="art-play" id="art-play" aria-label="播放或暂停"><svg><use href="#i-play"/></svg></button></div>
      <div class="now-meta"><div><h3 id="now-title">暮色飞行</h3><p id="now-artist">Mori · 氛围电子</p></div><button class="icon-button heart-button" id="now-like" aria-label="收藏当前歌曲"><svg><use href="#i-heart"/></svg></button></div>
      <div class="waveform" id="waveform" aria-hidden="true"></div>
      <div class="queue-title"><h3>接下来播放</h3><span id="queue-count">5 首</span></div>
      <div class="queue-list" id="queue-list"></div>
      <div class="listening-card"><svg><use href="#i-headphones"/></svg><div><strong>纯享这一刻</strong><span>没有广告来打扰你</span></div><span class="equalizer"><i></i><i></i><i></i></span></div>
    </aside>
  </div>

  <nav class="mobile-tabs" aria-label="快速导航">
    <button data-view="home"><svg><use href="#i-home"/></svg><span>首页</span></button>
    <button data-view="discover"><svg><use href="#i-compass"/></svg><span>发现</span></button>
    <button data-view="life"><svg><use href="#i-life"/></svg><span>生活</span></button>
    <button data-view="library"><svg><use href="#i-library"/></svg><span>曲库</span></button>
    <button data-view="favorites"><svg><use href="#i-heart"/></svg><span>收藏</span></button>
  </nav>

  <footer class="player">
    <div class="player-track">
      <div class="mini-cover cover art-0" id="mini-cover"><span>QIYIN</span></div>
      <div class="player-track-copy"><strong id="player-title">暮色飞行</strong><span id="player-artist">Mori</span></div>
      <button class="icon-button heart-button" id="player-like" aria-label="收藏"><svg><use href="#i-heart"/></svg></button>
    </div>
    <div class="player-center">
      <div class="player-controls">
        <button class="icon-button mode-button" id="shuffle-button" aria-label="随机播放" title="随机播放"><svg><use href="#i-shuffle"/></svg></button>
        <button class="icon-button" id="prev-button" aria-label="上一首"><svg><use href="#i-prev"/></svg></button>
        <button class="play-button" id="play-button" aria-label="播放"><svg><use href="#i-play"/></svg></button>
        <button class="icon-button" id="next-button" aria-label="下一首"><svg><use href="#i-next"/></svg></button>
        <button class="icon-button mode-button" id="repeat-button" aria-label="循环播放" title="循环播放"><svg><use href="#i-repeat"/></svg><span id="repeat-one">1</span></button>
      </div>
      <div class="timeline"><span id="current-time">0:00</span><input id="progress" class="range" type="range" min="0" max="1000" value="0" aria-label="播放进度"><span id="duration">0:34</span></div>
    </div>
    <div class="player-tools">
      <button class="icon-button" id="queue-button" aria-label="显示播放队列" title="播放队列"><svg><use href="#i-list"/></svg></button>
      <button class="icon-button" id="mute-button" aria-label="静音"><svg><use href="#i-volume"/></svg></button>
      <input id="volume" class="range volume-range" type="range" min="0" max="100" value="72" aria-label="音量">
    </div>
  </footer>

  <audio id="audio" preload="metadata"></audio>
  <div class="toast" id="toast" role="status"></div>
  <dialog id="info-dialog">
    <button class="dialog-close icon-button" id="dialog-close" aria-label="关闭"><svg><use href="#i-close"/></svg></button>
    <div id="dialog-content"></div>
  </dialog>
  <script src="assets/app.js"></script>
</body>
</html>
